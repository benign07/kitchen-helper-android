name: Build OTA release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore OTA signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ota-signing.keystore"
          chmod 600 "$RUNNER_TEMP/ota-signing.keystore"

      - name: Build and verify
        env:
          OTA_KEYSTORE_PATH: ${{ runner.temp }}/ota-signing.keystore
        run: ./gradlew assembleDebug lintDebug

      - name: Verify OTA signing certificate
        run: |
          ACTUAL_DIGEST=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          EXPECTED_DIGEST="b7d744795a4c8813234f9913c0004856be2185eeee51f72d72a0892fdcc70c16"
          test "$ACTUAL_DIGEST" = "$EXPECTED_DIGEST"

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk kitchen-helper.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: kitchen-helper.apk
          generate_release_notes: true
