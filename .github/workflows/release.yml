name: Build OTA release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore OTA signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build and verify
        run: ./gradlew assembleDebug lintDebug

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk kitchen-helper.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: kitchen-helper.apk
          generate_release_notes: true
