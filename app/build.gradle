apply plugin: "com.android.application"

android {
    namespace "kr.co.kitchenhelper.inspector"
    compileSdk 36

    defaultConfig {
        applicationId "kr.co.kitchenhelper.inspector"
        minSdk 26
        targetSdk 36
        versionCode 15
        versionName "0.14.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
